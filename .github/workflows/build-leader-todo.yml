name: Build リーダーTODO (Windows exe)

on:
  push:
    paths:
      - "leader_todo/**"
      - ".github/workflows/build-leader-todo.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: leader_todo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check page scripts
        shell: bash
        run: for f in web/*.js; do node --check "$f"; done

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LeaderTODO
          --icon icon.ico
          --add-data "web;web"
          --add-data "icon.ico;."
          desktop.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: LeaderTODO-exe
          path: leader_todo/dist/LeaderTODO.exe
          if-no-files-found: error
