<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>リーダー TODO</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/links.css">
  <link rel="stylesheet" href="/growth.css">
  <link rel="stylesheet" href="/settings.css">
  <link rel="stylesheet" href="/report.css">
  <link rel="stylesheet" href="/dollbox.css">
  <link rel="stylesheet" href="/garo.css">
  <link rel="stylesheet" href="/dozle.css">
  <script defer src="/vendor/pdf-lib.min.js"></script>
  <script defer src="/vendor/fontkit.umd.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/growth.js"></script>
  <script defer src="/report.js"></script>
  <script defer src="/excel_import.js"></script>
  <script defer src="/checklist_edit.js"></script>
  <script defer src="/share.js"></script>
  <script defer src="/garo.js"></script>
  <script defer src="/dozle.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" id="brand-mark">L</span><div><strong>リーダー TODO</strong><small id="brand-caption">Leader workspace</small></div></div>
      <nav class="nav" aria-label="メインメニュー">
        <button data-view="home" class="nav-item active"><span>⌂</span>ホーム</button>
        <button data-view="checklist" class="nav-item"><span>✓</span>日次チェック</button>
        <button data-view="todos" class="nav-item"><span>☷</span>自由 TODO</button>
        <button data-view="calendar" class="nav-item"><span>▦</span>カレンダー</button>
        <button data-view="records" class="nav-item"><span>✎</span>リーダー記録</button>
        <button data-view="growth" class="nav-item"><span>◎</span>成長の可視化</button>
        <button data-view="hp" class="nav-item"><span>◈</span>HP 画像チェック</button>
        <button data-view="references" class="nav-item"><span>↗</span>関連リンク</button>
      </nav>
      <div class="sidebar-bottom"><div class="garo-vitals" id="garo-vitals" aria-label="出玉と連チャンの状況"></div><div class="sidebar-status"><span class="status-dot"></span><span id="save-status">読み込み中</span></div><button class="text-button" data-action="open-data-folder">保存先を表示</button><button data-view="settings" class="nav-item settings-nav"><span aria-hidden="true">⚙</span>設定</button></div>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="breadcrumbs" id="breadcrumb">ホーム</div><div class="garo-holds" id="garo-holds" aria-label="保留（未完了のTODO）"></div><div class="topbar-right"><span id="today-label"></span><button type="button" class="garo-sound" id="garo-sound" data-action="toggle-garo-sound" aria-pressed="false" title="演出音のオン・オフ">♪ OFF</button><div class="theme-switch" role="group" aria-label="カラーテーマ"><button type="button" data-action="set-theme" data-theme="standard" aria-pressed="true">標準</button><button type="button" data-action="set-theme" data-theme="garo" aria-pressed="false">黄金騎士</button><button type="button" data-action="set-theme" data-theme="dozle" aria-pressed="false">ドズル社風</button></div><button class="icon-button mobile-menu" id="menu-button" aria-label="メニューを開く">☰</button></div></header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="garo-stage" id="garo-stage" aria-hidden="true"></div>
  <div class="garo-announce" id="garo-announce" role="status" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="edit-dialog"><form method="dialog" id="edit-form"><div id="dialog-content"></div></form></dialog>
  <dialog id="report-dialog" aria-label="リーダー記録レポート"><div id="report-dialog-content"></div></dialog>
</body>
</html>
